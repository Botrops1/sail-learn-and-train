name: Strip AI attribution

# The cloud sessions' tools add a "Generated by Claude Code" footer (and sometimes a claude.ai
# session link) to what they post. The project does not want those (CLAUDE.md), and an
# instruction in a prompt cannot stop a tool that adds them itself. So this removes them from PR
# and issue descriptions, comments, reviews and review comments right after they are posted.
# Only those lines are removed; everything else in the text is kept as it was.

on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
  pull_request_target:
    types: [opened, edited]
  issues:
    types: [opened, edited]

permissions:
  issues: write
  pull-requests: write

jobs:
  strip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const payload = context.payload;

            // The text is only ever treated as data here, never run.
            const LINE = [
              /^\s*_?\s*(?:🤖\s*)?Generated\s+(?:with|by)\s+\[?Claude(?:\s+Code)?\]?(?:\([^)]*\))?\s*_?\s*$/i,
              /^\s*https?:\/\/claude\.ai\/code\/\S*\s*$/i,
              /^\s*Claude-Session:.*$/i,
              /^\s*Co-Authored-By:\s*Claude\b.*$/i,
            ];
            const RULE = /^\s*(?:---+|___+|\*\*\*+)\s*$/;

            function strip(text) {
              if (!text) return text;
              const lines = text.split('\n');
              const kept = lines.filter((l) => !LINE.some((re) => re.test(l)));
              if (kept.length === lines.length) return text;
              // drop blank lines and a horizontal rule left dangling at the end
              while (kept.length) {
                const last = kept[kept.length - 1];
                if (last.trim() === '' || RULE.test(last)) kept.pop();
                else break;
              }
              return kept.join('\n') + '\n';
            }

            async function fix(label, oldBody, update) {
              const body = strip(oldBody);
              if (body === oldBody || body === (oldBody || '').trimEnd() + '\n') return;
              await update(body);
              core.info(`Removed attribution lines from ${label}`);
            }

            if (payload.comment && context.eventName === 'issue_comment') {
              await fix(`comment ${payload.comment.id}`, payload.comment.body, (body) =>
                github.rest.issues.updateComment({ owner, repo, comment_id: payload.comment.id, body }));
            } else if (payload.comment && context.eventName === 'pull_request_review_comment') {
              await fix(`review comment ${payload.comment.id}`, payload.comment.body, (body) =>
                github.rest.pulls.updateReviewComment({ owner, repo, comment_id: payload.comment.id, body }));
            } else if (payload.review) {
              await fix(`review ${payload.review.id}`, payload.review.body, (body) =>
                github.rest.pulls.updateReview({
                  owner, repo, pull_number: payload.pull_request.number, review_id: payload.review.id, body,
                }));
            } else if (context.eventName === 'pull_request_target') {
              await fix(`PR #${payload.pull_request.number}`, payload.pull_request.body, (body) =>
                github.rest.pulls.update({ owner, repo, pull_number: payload.pull_request.number, body }));
            } else if (context.eventName === 'issues') {
              await fix(`issue #${payload.issue.number}`, payload.issue.body, (body) =>
                github.rest.issues.update({ owner, repo, issue_number: payload.issue.number, body }));
            }

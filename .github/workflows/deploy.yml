name: Deploy to GitHub Pages

# Publishes main to the root of the gh-pages branch. GitHub Pages serves that branch
# (Settings → Pages → Deploy from a branch → gh-pages, / (root)). Pull request previews live
# in gh-pages under pr-preview/ (see pr-preview.yml) and are left untouched here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # GITHUB_SHA is the commit on main, so the footer shows the merged commit.
      - run: npm run build
      # Serve the files as they are (no Jekyll processing on the gh-pages branch).
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: pr-preview/
          force: false

name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The browser checks (scripts/shots.mjs): every milestone's scenes at phone size plus every
  # live and tap check. Fails on console errors, wrong layouts, page scroll, unknown taps and
  # failed live checks. Split into parallel parts of at most about 10 minutes on GitHub's runners
  # (each live group prints its time, "live group m9: 120 s"; move groups when a part grows).
  # The last part takes every live group not named in another one, so a new milestone's live
  # checks land there by themselves.
  browser-part:
    name: browser (${{ matrix.part }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: scenes 1/2
            env: SHOTS_NO_LIVE=1 SHOTS_NO_TAPS=1 SHOTS_SHARD=1/2
          - part: scenes 2/2
            env: SHOTS_NO_LIVE=1 SHOTS_NO_TAPS=1 SHOTS_SHARD=2/2
          - part: taps
            env: SHOTS_NO_SCENES=1 SHOTS_NO_LIVE=1
          - part: live, M0-M4a
            env: SHOTS_NO_SCENES=1 SHOTS_ONLY=general
          - part: live, M4b-M4c
            env: SHOTS_NO_SCENES=1 SHOTS_ONLY=m4b,m4c
          - part: live, M5-M8
            env: SHOTS_NO_SCENES=1 SHOTS_ONLY=m5,m6,m7,m8
          - part: live, M9
            env: SHOTS_NO_SCENES=1 SHOTS_ONLY=m9
          - part: live, M10-M17
            env: SHOTS_NO_SCENES=1 SHOTS_ONLY=m10,m11,m12,m13,m14,m15,m16,m17
          - part: live, M18-M29
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m18,m19,m20,m21,m22,m23,m24,m25,m26,m27,m28,m29
          - part: live, M30 on
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_SKIP=general,m4b,m4c,m5,m6,m7,m8,m9,m10,m11,m12,m13,m14,m15,m16,m17,m18,m19,m20,m21,m22,m23,m24,m25,m26,m27,m28,m29,m40,m41,m42,m43,m44,m45,m46,m47,m48,m49,m50,m51,m52,m53,m54,m55,m56,m57,m58,m59,budget,m60,m60b,m61,m62,m63,m64,m65,m66,m67,m68,m69,m70,m71
          - part: live, M40-M47
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m40,m41,m42,m43,m44,m45,m46,m47
          - part: live, M48-M59
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m48,m49,m50,m51,m52,m53,m54,m55,m56,m57,m58,m59
          - part: live, M60-M62
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=budget,m60,m60b,m61,m62
          - part: live, M63-M65
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m63,m64,m65
          - part: live, M66-M67
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m66,m67
          - part: live, M68
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m68
          - part: live, M69
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m69
          - part: live, M70-M71
            env: SHOTS_NO_SCENES=1 SHOTS_NO_TAPS=1 SHOTS_ONLY=m70,m71
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The cloud sessions' default font (Inter), so text sizes match theirs.
      - run: |
          sudo apt-get install -y --no-install-recommends fonts-inter
          mkdir -p ~/.config/fontconfig
          cp .github/fontconfig.conf ~/.config/fontconfig/fonts.conf
          fc-match sans-serif
      - run: env SHOTS_SIZES=phone ${{ matrix.env }} npm run shots
      # The PNGs are kept as a download only when a part fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shots-${{ strategy.job-index }}
          path: shots/
          retention-days: 7

  # One result for the branch protection rule: green only when every part passed.
  browser-checks:
    needs: browser-part
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.browser-part.result }}" = success

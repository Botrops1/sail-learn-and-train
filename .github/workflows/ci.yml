name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Every milestone's scenes at phone size plus every live and tap check (scripts/shots.mjs).
  # Fails on console errors, wrong layouts, page scroll, unknown taps and failed live checks.
  # The PNGs are kept as a download only when it fails.
  browser-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run shots
        env:
          SHOTS_SIZES: phone
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shots
          path: shots/
          retention-days: 7

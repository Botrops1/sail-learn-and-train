name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'full = every browser check group; pr = the smaller set a pull request runs'
        type: choice
        options: [full, pr]
        default: full
  workflow_call:
    inputs:
      scope:
        description: 'full or pr'
        type: string
        default: full

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Decides which browser checks run (scripts/ci-plan.mjs, PHASE_LAUNCH_SPEC 6): a pull request
  # runs the scenes, the taps, "general", the group of its own milestone (from the title), the
  # newest groups, the groups its changed files call for (.github/ci-paths.json: a change to the
  # store, the URL state, the layout shell or the scene setup runs everything) and any named in a
  # "CI groups: m68, m75" line of its description ("CI groups: all" runs everything); a pull
  # request that only changes documents runs none. The full set runs from nightly.yml and before
  # a release. The title and the description are fetched from the API at run time, so "Re-run
  # jobs" reads them as they are now (the event's text is the fallback if the call fails). They
  # reach the script only through a file or env:, never a run: line.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Files changed by the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed.txt"
      - name: Title and description as they are now
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$REPO/pulls/$NUMBER" --jq '{title, body}' > "$RUNNER_TEMP/pr.json.tmp"; then
            mv "$RUNNER_TEMP/pr.json.tmp" "$RUNNER_TEMP/pr.json"
          else
            echo "::warning::Could not read the pull request; using the text of the event."
            rm -f "$RUNNER_TEMP/pr.json.tmp"
          fi
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          PR_FILE: ${{ runner.temp }}/pr.json
          CI_SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || inputs.scope }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ runner.temp }}/changed.txt

  # The browser checks (scripts/shots.mjs): scenes at phone size, the taps and the live checks of
  # the groups the plan names, packed into parts by recorded times (.github/ci-times.json). Fails
  # on console errors, wrong layouts, page scroll, unknown taps and failed live checks. Each live
  # group prints its time ("live group m9: 120 s"); refresh ci-times.json from those.
  browser-part:
    name: browser (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The test browser is cached by Playwright's version (installing it took 8-19 minutes in
      # four parts of PR 174's run); the install does nothing when the cache restored it.
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: npx playwright install chromium
      # The cloud sessions' default font (Inter), so text sizes match theirs.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-inter
          mkdir -p ~/.config/fontconfig
          cp .github/fontconfig.conf ~/.config/fontconfig/fonts.conf
          fc-match sans-serif
      - run: env SHOTS_SIZES=phone ${{ matrix.env }} npm run shots
      # The PNGs are kept as a download only when a part fails.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: shots-${{ strategy.job-index }}
          path: shots/
          retention-days: 7

  # One result for the branch protection rule: green when the plan worked and every part passed
  # (or none was needed, for a documents-only pull request).
  browser-checks:
    needs: [plan, browser-part]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          PLAN: ${{ needs.plan.result }}
          PARTS: ${{ needs.browser-part.result }}
        run: |
          test "$PLAN" = success
          test "$PARTS" = success || test "$PARTS" = skipped

<!doctype html>
<html lang="en" data-layout="stacked">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#cfe5f3" />
    <meta
      name="description"
      content="Learn how a cruising yacht's ropes, sheets and sails behave. Reference boat: Hanse 508."
    />
    <title>Sail: learn and train</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Link previews (WhatsApp, Telegram, Facebook, X); %SITE_URL% is filled in by vite.config.ts. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sail: learn and train" />
    <meta property="og:title" content="Sail: learn and train" />
    <meta
      property="og:description"
      content="A free browser app that shows a beginner what every rope, sheet and sail of a cruising yacht does. Works on a phone."
    />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A 3D sailing yacht with its sails up, and the app's name"
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>This app needs JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
